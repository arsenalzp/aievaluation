apiVersion: ai.evaluation.io/v1alpha1
kind: EvalSuite
metadata:
  name: demo-suite
spec:
  datasetRef:
    name: demo-dataset
  regressionPolicy:
    maxDrop: 0.03
  metrics:
    generation:
      minFaithfulness: 0.80
      minCorrectness: 0.75
    retrieval:
      minContextRecall: 0.70
      minContextPrecision: 0.65
  execution:
    runnerImage: "repo-images.svc.cluster:5000/runner:0.2"
    timeoutSeconds: 300