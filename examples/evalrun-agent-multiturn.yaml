apiVersion: ai.evaluation.io/v1alpha1
kind: EvalRun
metadata:
  name: demo-run-agent-multiturn-1
spec:
  # Judge of the deepeval evaluator. A multi-turn suite without a deepeval evaluator must omit spec.llm.
  # No embedder: only RAG suites use an embedding model.
  llm:
    provider: openai
    model: "gpt-5-mini"
    apiKeySecretRef:
      name: openai-credentials
      key: apiKey
  summaryBucket: "eval-artifacts"
  suiteRef:
    name: demo-suite-agent-multiturn
  revision:
    gitSHA: "abc123"
    prNumber: 1
  # The tested agent endpoint must implement the session-aware turn contract (see README).
  targetEndpoint: "https://travel-agent.svc.cluster:8080/chat"
