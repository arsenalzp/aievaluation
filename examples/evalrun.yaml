apiVersion: ai.evaluation.io/v1alpha1
kind: EvalRun
metadata:
  name: demo-run-1
spec:
  # LLM for the RAG metrics and the Safety Judge (judge + embedder from the same provider).
  llm:
    provider: openai
    model: "gpt-5-mini"
    embedder: "text-embedding-3-small"
    # url: "http://vllm.models.svc:8000/v1"   # optional: any OpenAI-compatible server
    apiKeySecretRef:                          # optional when url is set (server without authentication)
      name: openai-credentials
      key: apiKey
  summaryBucket: "eval-artifacts"
  suiteRef:
    name: demo-suite-rag
  revision:
    gitSHA: "abc123"
    prNumber: 1
  targetEndpoint: "https://rag-system.svc.cluster:8080/rag/query?debug=true"