# This rule is not used by the project ai-eval itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ai.evaluation.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ai-eval
    app.kubernetes.io/managed-by: kustomize
  name: evalrun-editor-role
rules:
- apiGroups:
  - ai.evaluation.io
  resources:
  - evalruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ai.evaluation.io
  resources:
  - evalruns/status
  verbs:
  - get
