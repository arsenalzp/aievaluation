---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cache.ai.evaluation.io
  resources:
  - evalsuites
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cache.ai.evaluation.io
  resources:
  - evalsuites/finalizers
  verbs:
  - update
- apiGroups:
  - cache.ai.evaluation.io
  resources:
  - evalsuites/status
  verbs:
  - get
  - patch
  - update
