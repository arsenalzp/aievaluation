{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
    annotations:
        controller-gen.kubebuilder.io/version: v0.18.0
    name: evalsuites.ai.evaluation.io
spec:
    group: ai.evaluation.io
    names:
        kind: EvalSuite
        listKind: EvalSuiteList
        plural: evalsuites
        singular: evalsuite
    scope: Namespaced
    versions:
        - name: v1alpha1
          schema:
            openAPIV3Schema:
                description: EvalSuite is the Schema for the evalsuites API.
                properties:
                    apiVersion:
                        description: |-
                            APIVersion defines the versioned schema of this representation of an object.
                            Servers should convert recognized schemas to the latest internal value, and
                            may reject unrecognized values.
                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
                        type: string
                    kind:
                        description: |-
                            Kind is a string value representing the REST resource this object represents.
                            Servers may infer this from the endpoint the client submits requests to.
                            Cannot be updated.
                            In CamelCase.
                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                        type: string
                    metadata:
                        type: object
                    spec:
                        description: EvalSuiteSpec defines the desired state of EvalSuite.
                        properties:
                            datasetRef:
                                description: DatasetRef references EvalDataset resource (not ConfigMap).
                                properties:
                                    name:
                                        default: ""
                                        description: |-
                                            Name of the referent.
                                            This field is effectively required, but due to backwards compatibility is
                                            allowed to be empty. Instances of this type with an empty value here are
                                            almost certainly wrong.
                                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                        type: string
                                type: object
                                x-kubernetes-map-type: atomic
                            execution:
                                properties:
                                    mode:
                                        enum:
                                            - agent
                                            - rag
                                            - dummy
                                        type: string
                                    runnerImage:
                                        type: string
                                    timeoutSeconds:
                                        format: int64
                                        type: integer
                                type: object
                            metrics:
                                properties:
                                    agent:
                                        properties:
                                            maxPolicyViolations:
                                                format: int32
                                                minimum: 0
                                                type: integer
                                            minToolExecution:
                                                maximum: 1
                                                minimum: 0
                                                type: number
                                            minToolInvocation:
                                                maximum: 1
                                                minimum: 0
                                                type: number
                                            minToolSelection:
                                                maximum: 1
                                                minimum: 0
                                                type: number
                                        type: object
                                    rag:
                                        properties:
                                            generation:
                                                properties:
                                                    minCorrectness:
                                                        type: number
                                                    minFaithfulness:
                                                        type: number
                                                    minRelevancy:
                                                        type: number
                                                type: object
                                            retrieval:
                                                properties:
                                                    minContextPrecision:
                                                        type: number
                                                    minContextRecall:
                                                        type: number
                                                type: object
                                            trustworthiness:
                                                description: |-
                                                    EDIT THIS FILE!  THIS IS SCAFFOLDING FOR YOU TO OWN!
                                                    NOTE: json tags are required.  Any new fields you add must have json tags for the fields to be serialized.
                                                properties:
                                                    maxStaleChunkRatio:
                                                        type: number
                                                    maxUnknownOwnerRatio:
                                                        type: number
                                                type: object
                                        type: object
                                type: object
                            regressionPolicy:
                                properties:
                                    maxDrop:
                                        type: number
                                type: object
                        type: object
